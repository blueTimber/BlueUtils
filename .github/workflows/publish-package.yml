name: Publish Unity Package

on:
  push:
    tags:
      - "v*"   # trigger on tags like v1.2.0

permissions:
  contents: write 

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for subtree split

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # "v1.2.0" -> "1.2.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
             '.version = $v' \
             Assets/BlueUtils/package.json > /tmp/package.json.tmp
          mv /tmp/package.json.tmp Assets/BlueUtils/package.json

      - name: Amend version bump into current commit (local only)
        run: |
          git add Assets/BlueUtils/package.json
          git commit --amend --no-edit

      - name: Split package subfolder into its own branch
        run: |
          git subtree split --prefix=Assets/BlueUtils -b upm

      - name: Push package branch
        run: |
          git push origin upm:upm --force

      - name: Tag the published branch with the same version
        run: |
          git checkout upm
          git tag "v${{ steps.version.outputs.version }}" -f
          git push origin "v${{ steps.version.outputs.version }}" -f
